<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - 管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="top-nav">
        <div class="logo">管理系统</div>
        <nav class="nav-links">
            <a href="{{ url_for('login') }}" class="nav-item">退出登录</a>
        </nav>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            {% block sidebar %}
            <nav class="side-menu">
                <!-- 菜单内容由子模板扩展 -->
            </nav>
            {% endblock %}
        </aside>

        <main class="content-area">
            <div id="content-frame">
                {% block content %}
                <!-- 动态内容区域 -->
                {% endblock %}
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-content">
            © 2024 管理系统 | 版本号 1.0.0 | 技术支持：信息中心
        </div>
    </footer>
</body>
</html>
