
{% block content %}
<div class="user-profile">
    <h2>个人信息</h2>
    <form action="/user/update_info" method="post" class="profile-form">
        <div class="form-group">
            <label>姓名：</label>
            <input type="text" name="name" value="{{ current_user.name }}">
        </div>
        <div class="form-group">
            <label>邮箱：</label>
            <input type="email" name="email" value="{{ current_user.email }}" readonly>
        </div>
        <button type="submit" class="btn-save">保存信息</button>
    </form>

    <h2>修改密码</h2>
    <form action="/user/change_password" method="post" class="password-form">
        <div class="form-group">
            <label>旧密码：</label>
            <input type="password" name="old_password" required>
        </div>
        <div class="form-group">
            <label>新密码：</label>
            <input type="password" name="new_password" required>
        </div>
        <button type="submit" class="btn-change">修改密码</button>
    </form>
</div>
{% endblock %}
