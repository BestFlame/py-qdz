{% extends 'base.html' %}

{% block title %}系统设置{% endblock %}

{% block content %}
<div class="system-settings">
    <h2>系统配置</h2>
    <form class="settings-form">
        <div class="form-group">
            <label>系统名称：</label>
            <input type="text" name="system_name" value="企业管理系统">
        </div>
        <div class="form-group">
            <label>数据备份路径：</label>
            <input type="text" name="backup_path" value="/var/backups">
        </div>
        <button type="submit" class="btn-save">保存设置</button>
    </form>

    <h2>权限管理</h2>
    <div class="permission-list">
        <!-- 这里后续可以添加动态权限列表 -->
        <div class="permission-item">
            <span>管理员权限</span>
            <div class="switch">
                <input type="checkbox" id="admin-permission">
                <label for="admin-permission"></label>
            </div>
        </div>
    </div>
</div>
{% endblock %}
